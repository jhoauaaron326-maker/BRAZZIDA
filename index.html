<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAZZIDA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#000;color:#fff}header{padding:20px;display:flex;justify-content:space-between;border-bottom:1px solid #222;position:sticky;top:0;background:#000} .logo{font-weight:900;letter-spacing:3px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#222;padding:1px} .card{background:#000} .card img{width:100%;aspect-ratio:3/4;object-fit:cover} .info{padding:10px;font-size:12px} .admin{position:fixed;inset:0;background:#000;z-index:99;display:none;padding:20px;overflow:auto} .admin.on{display:block} .inp{width:100%;background:#111;border:1px solid #222;color:#fff;padding:12px;margin-bottom:10px;border-radius:6px} .btn{width:100%;background:#fff;color:#000;padding:12px;border:none;border-radius:6px;font-weight:700;margin-bottom:8px}</style></head><body><header><div class="logo">BRAZZIDA</div><div onclick="document.getElementById('adm').classList.add('on')" style="opacity:.6;font-size:12px">ADMIN</div></header><div style="padding:60px 20px 20px"><h1 style="font-size:14vw;line-height:.9;font-weight:900">NUEVA<br>COLECCION</h1></div><div id="grid" class="grid"></div><div id="adm" class="admin"><div style="display:flex;justify-content:space-between"><h2>ADMIN</h2><button onclick="document.getElementById('adm').classList.remove('on')" style="background:#222;color:#fff;border:none;padding:8px 12px;border-radius:20px">X</button></div><div id="login"><input id="p" type="password" class="inp" placeholder="Clave brazzida123"><button class="btn" onclick="if(document.getElementById('p').value=='brazzida123'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';loadA()}else alert('clave mal')">ENTRAR</button></div><div id="panel" style="display:none"><input id="n" class="inp" placeholder="Nombre"><input id="pr" type="number" class="inp" placeholder="Precio S/"><select id="c" class="inp"><option>VESTIDOS</option><option>BLUSAS</option><option>CONJUNTOS</option></select><input id="t" class="inp" placeholder="Talla S M L"><input id="img" class="inp" placeholder="Link foto"><input id="f" type="file" accept="image/*" class="inp"><button class="btn" onclick="saveP()">GUARDAR</button><div id="list"></div></div></div><script>const supa=supabase.createClient("https://faxxtsdcdgxkaiepezht.supabase.co","sb_publishable_jIVH-GpNOUIi17oNfWPjHA_ZRtlmhBe");let b64="";document.getElementById('f').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>{b64=ev.target.result;document.getElementById('img').value="archivo listo"};r.readAsDataURL(e.target.files[0])});async function load(){let {data}=await supa.from('prendas').select('*').order('id',{ascending:false});render(data||[])}function render(d){document.getElementById('grid').innerHTML=d.map(x=>`<div class="card" onclick="window.open('https://wa.me/51999999999?text=Hola quiero ${x.nombre}')"><img src="${x.imagen}"><div class="info"><b>${x.nombre}</b><br><span style="opacity:.5">${x.categoria} ${x.talla||''}</span> S/ ${x.precio}</div></div>`).join('')}async function loadA(){let {data}=await supa.from('prendas').select('*').order('id',{ascending:false});render(data||[]);document.getElementById('list').innerHTML=(data||[]).map(x=>`<div style="display:flex;gap:10px;background:#111;padding:10px;margin-bottom:8px;border-radius:6px;align-items:center"><img src="${x.imagen}" style="width:40px;height:50px;object-fit:cover"><span style="font-size:12px">${x.nombre}</span><button onclick="delP('${x.id}')" style="margin-left:auto;background:red;color:#fff;border:none;padding:4px 8px;border-radius:10px">X</button></div>`).join('')}async function saveP(){let im=b64||document.getElementById('img').value;let {error}=await supa.from('prendas').insert([{nombre:document.getElementById('n').value,precio:document.getElementById('pr').value,categoria:document.getElementById('c').value,talla:document.getElementById('t').value,imagen:im}]);if(error)alert(error.message);else{alert('Guardado');loadA();b64=""}}async function delP(id){if(confirm('Borrar?')){await supa.from('prendas').delete().eq('id',id);loadA()}}load();</script></body></html>
